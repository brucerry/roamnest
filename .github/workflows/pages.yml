name: Pages
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            deploy:
                description: Publish the tested static build to GitHub Pages
                type: boolean
                required: true
                default: false
permissions:
    contents: read
concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: false
jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out the complete repository history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: npm
            - name: Install locked dependencies
              run: npm ci
            - name: Check source formatting
              run: npm run format:check
            - name: Check TypeScript
              run: npm run typecheck
            - name: Build and run functional tests
              run: npm test
            - name: Build the static site
              run: npm run build:static
            - name: Audit public files and repository history
              run: npm run audit:release
            - name: Install the isolated browser runtime
              run: node node_modules/playwright-core/cli.js install --with-deps chromium
            - name: Check portable hosting and responsive forms
              run: npm run test:browser
            - name: Check view transitions and menus
              run: npm run test:views
            - name: Check globe effects and geographic assets
              run: npm run test:globe-effects
            - name: Upload the tested static site
              if:
                  github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref ==
                  'refs/heads/main'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
              with:
                  path: dist
    deploy:
        if:
            github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref ==
            'refs/heads/main'
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Verify the Pages configuration
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
            - name: Deploy the tested artifact
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
